name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["web/**"]
  workflow_dispatch:

# Pages deployment requires these permissions plus an environment named
# "github-pages" (created automatically by actions/deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Serve the web/ directory (the single-file RDAP lookup + conformance UI)
      # as the site root.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
