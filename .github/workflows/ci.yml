name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out -count=1 ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # Applies migrations/001_init.sql against a FRESH PostgreSQL instance to catch
  # migration regressions (FK ordering, index portability, syntax) that would only
  # surface on a brand-new deployment.
  migration-postgres:
    name: Migration applies on fresh PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rdap
          POSTGRES_USER: rdap
          POSTGRES_PASSWORD: rdap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdap -d rdap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration to fresh DB
        run: >
          psql -h localhost -U rdap -d rdap -v ON_ERROR_STOP=1 -f migrations/001_init.sql
        env:
          PGPASSWORD: rdap

      - name: Verify schema and seed present
        run: |
          set -e
          psql -h localhost -U rdap -d rdap -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('domains','entities','nameservers','ip_networks','autnums','registry_history');"
          psql -h localhost -U rdap -d rdap -v ON_ERROR_STOP=1 -c \
            "SELECT ldh_name FROM domains WHERE handle='EX1-NAME';"
        env:
          PGPASSWORD: rdap

  # Applies migrations/002_mysql_init.sql against a FRESH MySQL 8 instance to catch
  # migration regressions that would only surface on a brand-new deployment.
  migration-mysql:
    name: Migration applies on fresh MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rdap
          MYSQL_USER: rdap
          MYSQL_PASSWORD: rdap
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration to fresh DB
        run: |
          set -e
          # 002_mysql_init.sql creates/uses the rdap database itself.
          mysql -h localhost -P 3306 -uroot -proot < migrations/002_mysql_init.sql

      - name: Verify schema and seed present
        run: |
          set -e
          mysql -h localhost -P 3306 -uroot -proot -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='rdap' AND table_name IN ('domains','entities','nameservers','ip_networks','autnums','registry_history');"
          mysql -h localhost -P 3306 -uroot -proot rdap -e \
            "SELECT ldh_name FROM domains WHERE handle='EX1-NAME';"